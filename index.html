<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كافيه شغف | Café Shaghaf</title>
  <meta name="description" content="كافيه شغف - حلويات، كيك، بوظة، قهوات ساخنة وباردة، وعصائر طازجة">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- Header -->
  <header class="header" id="header">
    <div class="container header-inner">
      <a href="#" class="logo" onclick="filterCategory('all'); return false;">
        <span class="logo-icon">☕</span>
        <span class="logo-text">شغف</span>
      </a>
      <div class="header-actions">
        <button class="btn-admin" id="adminBtn" title="لوحة التحكم">⚙️</button>
      </div>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero">
    <div class="hero-overlay"></div>
    <div class="container hero-content">
      <h1 class="hero-title">كافيه <span>شغف</span></h1>
      <p class="hero-subtitle">حيث تلتقي النكهة بالشغف • حلويات فاخرة وقهوة استثنائية</p>
      <a href="#menuArea" class="btn-primary">استكشف القائمة</a>
    </div>
  </section>

  <!-- Sticky Filter + Search -->
  <div class="filter-bar" id="filterBar">
    <div class="container">
      <div class="search-wrap">
        <input type="search" id="searchInput" placeholder="ابحث عن صنفك المفضل..." autocomplete="off">
        <span class="search-icon">🔍</span>
      </div>
      <div class="cat-pills" id="catPills">
        <button class="cat-btn active" data-cat="all" onclick="filterCategory('all')">الكل</button>
      </div>
    </div>
  </div>

  <!-- Loading -->
  <div id="loadingState" class="loading-state">
    <div class="spinner"></div>
    <p>جاري تحميل القائمة...</p>
  </div>

  <!-- Menu -->
  <main id="menuArea" class="menu-area" style="display:none;">
    <div class="container">
      <h2 class="section-title-main" id="currentCatTitle">كل الأصناف</h2>
      <div class="menu-grid" id="menuGrid"></div>
      <p id="noResults" class="no-results" style="display:none;">لا توجد نتائج</p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-grid">
        <div class="footer-brand">
          <span class="logo-icon">☕</span>
          <span class="logo-text">شغف</span>
          <p>نقدم لكم أفضل الحلويات والقهوة بكل حب وشغف</p>
        </div>
        <div class="footer-social" id="footerSocial"></div>
        <div class="footer-contact">
          <h4>تواصل معنا</h4>
          <p id="footerWhatsapp">📞 —</p>
        </div>
      </div>
      <div class="footer-bottom">
        <p>© 2026 كافيه شغف. جميع الحقوق محفوظة.</p>
      </div>
    </div>
  </footer>

  <!-- Floating Cart Bar -->
  <div class="cart-bar" id="cartBar" style="display:none;">
    <div class="cart-bar-inner">
      <span class="cart-count-badge" id="cartCountBadge">0</span>
      <button class="cart-bar-btn" id="openCartBtn">
        <span>عرض السلة</span>
        <span id="cartTotalText">0 ر.س</span>
      </button>
    </div>
  </div>

  <!-- Cart Modal -->
  <div class="modal" id="cartModal">
    <div class="modal-content cart-modal-content">
      <div class="modal-header">
        <h2>سلة الطلبات</h2>
        <button class="modal-close" id="closeCartModal">&times;</button>
      </div>
      <div class="modal-body" id="cartBody"></div>
    </div>
  </div>

  <!-- Admin Modal -->
  <div class="modal" id="adminModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>لوحة التحكم</h2>
        <button class="modal-close" id="closeModal">&times;</button>
      </div>
      <div class="modal-body" id="adminBody"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
