<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شغف</title>
  <meta name="description" content="شغف - حلويات وقهوة">
  <link rel="icon" id="faviconLink" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="header" id="header">
    <div class="container header-inner">
      <a href="#" class="logo" id="logoBtn">
        <img id="logoImg" class="logo-img" src="" alt="" style="display:none;">
        <span class="logo-icon" id="logoIcon">☕</span>
        <span class="logo-text" id="siteNameText">شغف</span>
      </a>
    </div>
  </header>
  <section class="hero">
    <div class="hero-overlay" id="heroOverlay"></div>
    <div class="container hero-content">
      <h1 class="hero-title" id="heroTitle" style="display:none;">كافيه <span id="heroNameSpan">شغف</span></h1>
      <p class="hero-subtitle" id="heroSubtitle"></p>
      <a href="#menuArea" class="btn-primary">استكشف القائمة</a>
    </div>
  </section>
  <div class="filter-bar" id="filterBar">
    <div class="container">
      <div class="search-wrap">
        <input type="search" id="searchInput" placeholder="ابحث عن صنفك المفضل..." autocomplete="off">
        <span class="search-icon">🔍</span>
      </div>
      <div class="cat-pills" id="catPills"></div>
    </div>
  </div>
  <div id="loadingState" class="loading-state"><div class="spinner"></div><p>جاري تحميل القائمة...</p></div>
  <main id="menuArea" class="menu-area" style="display:none;">
    <div class="container">
      <h2 class="section-title-main" id="currentCatTitle">كل الأصناف</h2>
      <div class="menu-grid" id="menuGrid"></div>
      <p id="noResults" class="no-results" style="display:none;">لا توجد نتائج</p>
    </div>
  </main>
  <footer class="footer">
    <div class="container">
      <div class="footer-brand-center">
        <span class="logo-icon" id="footerLogoIcon">☕</span>
        <span class="logo-text" id="footerNameText">شغف</span>
        <p id="footerDesc">نقدم لكم أفضل الحلويات والقهوة</p>
      </div>
      <div class="footer-social-icons" id="footerSocial"></div>
      <div id="secretArea" class="secret-tap"></div>
    </div>
  </footer>
  <div class="cart-bar" id="cartBar" style="display:none !important;" aria-hidden="true">
    <div class="cart-bar-inner">
      <span class="cart-count-badge" id="cartCountBadge">0</span>
      <button class="cart-bar-btn" id="openCartBtn" type="button">
        <span>عرض السلة</span>
        <span id="cartTotalText">0</span>
      </button>
    </div>
  </div>
  <div class="modal" id="cartModal" aria-hidden="true">
    <div class="modal-content">
      <div class="modal-header"><h2>سلة</h2><button class="modal-close" id="closeCartModal" type="button">&times;</button></div>
      <div class="modal-body" id="cartBody"></div>
    </div>
  </div>
  <div class="modal" id="adminModal">
    <div class="modal-content">
      <div class="modal-header"><h2>لوحة التحكم</h2><button class="modal-close" id="closeModal">&times;</button></div>
      <div class="modal-body" id="adminBody"></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <input type="file" id="fileInput" accept="image/*" style="display:none;">
  <script src="https://cdn.jsdelivr.net/gh/uneu2bb/cafe-shaghaf@044d93363729772b858dc967573829b82cced470/app.js"></script>
  <script src="currency.js"></script>
</body>
</html>
