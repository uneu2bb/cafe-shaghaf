<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كافيه شغف | Café Shaghaf</title>
  <meta name="description" content="كافيه شغف - حلويات، كيك، بوظة، قهوات ساخنة وباردة، وعصائر طازجة">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- Header -->
  <header class="header" id="header">
    <div class="container header-inner">
      <a href="#" class="logo" onclick="filterCategory('all'); return false;">
        <span class="logo-icon">☕</span>
        <span class="logo-text">شغف</span>
      </a>
      <div class="header-actions">
        <button class="btn-admin" id="adminBtn" title="لوحة التحكم">⚙️</button>
      </div>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero">
    <div class="hero-overlay"></div>
    <div class="container hero-content">
      <h1 class="hero-title">كافيه <span>شغف</span></h1>
      <p class="hero-subtitle">حيث تلتقي النكهة بالشغف • حلويات فاخرة وقهوة استثنائية</p>
    </div>
  </section>

  <!-- Sticky Filters + Search -->
  <div class="filters-bar" id="filtersBar">
    <div class="container">
      <div class="category-pills" id="categoryPills"></div>
      <div class="search-wrap">
        <input type="search" id="searchInput" placeholder="ابحث عن صنفك المفضل..." autocomplete="off">
        <span class="search-icon">🔍</span>
      </div>
    </div>
  </div>

  <!-- Loading -->
  <div id="loadingState" class="loading-state">
    <div class="spinner"></div>
    <p>جاري تحميل القائمة...</p>
  </div>

  <!-- Menu -->
  <main id="menuContainer" style="display:none;"></main>

  <!-- Floating Cart Bar -->
  <div class="cart-bar" id="cartBar" style="display:none;">
    <button class="cart-bar-btn" onclick="openCart()">
      <span class="cart-count" id="cartCount">0</span>
      <span>عرض السلة</span>
      <span class="cart-total" id="cartTotal">0 ر.س</span>
    </button>
  </div>

  <!-- Cart Modal -->
  <div class="modal" id="cartModal">
    <div class="modal-content cart-modal-content">
      <div class="modal-header">
        <h2>🛒 سلة الطلبات</h2>
        <button class="modal-close" onclick="closeCart()">&times;</button>
      </div>
      <div class="modal-body" id="cartBody"></div>
    </div>
  </div>

  <!-- Admin Modal -->
  <div class="modal" id="adminModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>لوحة التحكم</h2>
        <button class="modal-close" id="closeModal">&times;</button>
      </div>
      <div class="modal-body" id="adminBody"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-grid">
        <div class="footer-brand">
          <span class="logo-icon">☕</span>
          <span class="logo-text">شغف</span>
          <p>نقدم لكم أفضل الحلويات والقهوة بكل حب وشغف</p>
        </div>
        <div class="footer-links">
          <h4>الأقسام</h4>
          <div id="footerCats"></div>
        </div>
        <div class="footer-contact">
          <h4>تواصل معنا</h4>
          <div class="social-links" id="socialLinks"></div>
        </div>
      </div>
      <div class="footer-bottom">
        <p>© 2026 كافيه شغف. جميع الحقوق محفوظة.</p>
      </div>
    </div>
  </footer>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
